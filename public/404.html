<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA 路由重定向
    // 将 /admin 重定向到 /?p=admin，让 index.html 接管路由
    var l = window.location;
    var path = l.pathname + l.search + l.hash;
    window.location.replace('/?p=' + encodeURIComponent(path.slice(1)));
  </script>
</head>
<body>
</body>
</html>
